<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HACKERS Tycoon v2.4.1</title>
  <style>
    body { background: black; color: #00ff00; font-family: monospace; text-align: center; margin: 0; padding: 10px; }
    .game-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .panel { border: 2px solid #00ff00; background: #050505; padding: 15px; border-radius: 5px; width: 45%; min-width: 300px; }
    button { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 10px; margin: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #00ff00; color: #000; }
    button:disabled { border-color: #333; color: #333; cursor: not-allowed; background: transparent; }
    .crypto-btn { border-color: #ff9900; color: #ff9900; }
    .crypto-btn:hover { background: #ff9900; color: #000; }
    .btn-danger { border-color: #ff0000; color: #ff0000; }
    .btn-danger:hover { background: #ff0000; color: #000; }
    .cam-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-height: 100px; overflow-y: auto; border: 1px dashed #00ff00; background: #020202; }
    .stickman-cam { font-size: 20px; background: #111; border: 1px solid #00ff00; padding: 3px; border-radius: 3px; }
    .iframe-wrapper { width: 100%; height: 300px; border: 1px solid #00ff00; }
    iframe { width: 100%; height: 100%; border: none; }
    .cheat-input { background: black; color: #00ff00; border: 1px dashed #00ff00; padding: 5px; text-align: center; }
  </style>
</head>
<body>
  <h1>// ARMED... <span id="rock-ind" style="color:red;"></span></h1>
  <div class="game-container">
    <div class="panel">
      <h2>[ COMMANDS ]</h2>
      <button onclick="mHack()">⚡ CLICK TO HACK</button><hr style="border-color:#00ff00">
      <button id="b-serv" onclick="bServ()">Buy Server</button>
      <button id="b-sol" onclick="bSol()">Buy Solar</button>
      <h3>FINANCES & STATS</h3>
      <p>Cash: $<span id="c-disp">0</span> Birr | Income: +$<span id="i-disp">0</span>/s</p>
      <p>Servers: <span id="s-cnt">15</span> | Solars: <span id="sol-cnt">17</span> | Hacked: <span id="h-cnt">12</span></p>
      <hr style="border-color:#ff9900">
      <h3>🚀 COIN FARM</h3>
      <button id="b-rig" class="crypto-btn" onclick="bRig()">Buy Rig</button>
      <button id="b-sell" class="crypto-btn" onclick="sBtc()">💰 SELL ALL COINS</button>
      <p>Rigs: <span id="r-cnt" style="color:#ff9900">0</span> | Mined: <span id="b-disp" style="color:#ff9900">0.0000 BTC</span></p>
      <p>Value: <span id="b-val" style="color:#66ff66">$12,500</span>/BTC</p>
      <hr style="border-color:#00ff00">
      <h3>🔑 CHEAT OVERRIDE</h3>
      <input type="text" id="c-box" class="cheat-input" placeholder="ENTER CODE...">
      <button onclick="sCheat()">EXECUTE</button>
      <p id="c-msg" style="color:#ff9900; font-size:12px;"></p>
      <hr style="border-color:#00ff00">
      <h3>WEBCAMS (<span id="cam-st" style="color:#00ff00">ACTIVE</span>)</h3>
      <button id="b-cam" class="btn-danger" onclick="tCams()">🛑 STOP LIVE CAM</button>
      <div class="cam-grid" id="cam-disp"></div>
    </div>
    <div class="panel">
      <h2>[ TERMINAL ]</h2>
      <div class="iframe-wrapper"><iframe src="https://hackertyper.net"></iframe></div>
    </div>
  </div>
  <script>
    let cash=0, serv=15, sol=17, hacked=12, cAct=true, rigs=0, btc=0, bPrice=12500;
    let sCost=50, solCost=80, rCost=150, kAct=false, rAct=false;
    function pSnd() {
      try {
        const ctx = new(window.AudioContext || window.webkitAudioContext)();
        let o1=ctx.createOscillator(), g1=ctx.createGain(), o2=ctx.createOscillator(), g2=ctx.createGain();
        o1.type='triangle'; o1.frequency.setValueAtTime(880, ctx.currentTime); g1.gain.setValueAtTime(0.15, ctx.currentTime); g1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.1);
        o2.type='sine'; o2.frequency.setValueAtTime(1500, ctx.currentTime+0.06); g2.gain.setValueAtTime(0.0, ctx.currentTime); g2.gain.setValueAtTime(0.2, ctx.currentTime+0.06); g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
        o1.connect(g1); g1.connect(ctx.destination); o2.connect(g2); g2.connect(ctx.destination);
        o1.start(); o2.start(ctx.currentTime+0.06); o1.stop(ctx.currentTime+0.12); o2.stop(ctx.currentTime+0.4);
      } catch(e){}
    }
    function iCams() {
      const d=document.getElementById("cam-disp"); d.innerHTML="";
      if(!cAct){ d.innerHTML="<p style='color:red;margin:auto'>⚠️ FEED DISCONNECTED</p>"; return; }
      for(let i=0; i<hacked; i++) { aCam(i%5===0 && kAct); }
    }
    function aCam(g=false) {
      if(!cAct)return; const d=document.getElementById("cam-disp"), s=document.createElement("span");
      s.className="stickman-cam"; s.innerText=g?"👑":"🏃"; if(g){s.style.borderColor="#ff9900";s.style.background="#221100"}
      d.appendChild(s); d.scrollTop=d.scrollHeight;
    }
    function tCams() {
      cAct=!cAct; const b=document.getElementById("b-cam"), st=document.getElementById("cam-st");
      if(cAct){ b.innerText="🛑 STOP LIVE CAM"; b.className="btn-danger"; st.innerText="ACTIVE"; st.style.color="#00ff00"; }
      else { b.innerText="🟢 START LIVE CAM"; b.className=""; st.innerText="OFFLINE"; st.style.color="red"; }
      iCams();
    }
    function sCheat() {
      const r=document.getElementById("c-box").value.trim(), v=r.toUpperCase(), m=document.getElementById("c-msg");
      if(r==="$UDO FLY BELUGA"){ rAct=true; document.getElementById("rock-ind").innerText="🚀 SUPER ROCKET (5x SPEED!)"; m.innerText="ROCKET ACTIVE!"; m.style.color="#00ff00"; pSnd(); uUI(); }
      else if(v==="KREEK"||v==="VIRAL"){ kAct=true; m.innerText="GOLD CAMS ACTIVE!"; m.style.color="#00ff00"; iCams(); pSnd(); }
      else if(v==="OPSECRET"||v==="RICH"){ cash+=999999999; m.innerText="CASH ADDED!"; m.style.color="#00ff00"; uUI(); pSnd(); }
      else { m.innerText="INVALID CODE."; m.style.color="red"; }
      document.getElementById("c-box").value="";
    }
    function uUI() {
      document.getElementById("c-disp").innerText=cash.toLocaleString(); document.getElementById("s-cnt").innerText=serv;
      document.getElementById("sol-cnt").innerText=sol; document.getElementById("h-cnt").innerText=hacked;
      document.getElementById("r-cnt").innerText=rigs; document.getElementById("b-disp").innerText=btc.toFixed(4)+" BTC";
      document.getElementById("b-val").innerText="$"+bPrice; let bInc=Math.floor((serv*2)+(sol*1.5)), fInc=rAct?(bInc*5):bInc;
      document.getElementById("i-disp").innerText=fInc; document.getElementById("b-serv").innerText=`Buy Server ($${sCost})`;
      document.getElementById("b-serv").disabled=cash<sCost; document.getElementById("b-sol").innerText=`Buy Solar ($${solCost})`;
      document.getElementById("b-sol").disabled=cash<solCost; document.getElementById("b-rig").innerText=`Buy Rig ($${rCost})`;
      document.getElementById("b-rig").disabled=cash<rCost; document.getElementById("b-sell").disabled=btc<=0;
    }
    function mHack() { let p=rAct?5:1; hacked+=p; cash+=(p*10); for(let i=0;i<p;i++)aCam(hacked%5===0&&kAct); uUI(); }
    function bServ() { if(cash>=sCost){ cash-=sCost; serv++; sCost=Math.floor(sCost*1.25); pSnd(); uUI(); } }
    function bSol() { if(cash>=solCost){ cash-=solCost; sol++; solCost=Math.floor(solCost*1.2); pSnd(); uUI(); } }
    function bRig() { if(cash>=rCost){ cash-=rCost; rigs++; rCost=Math.floor(rCost*1.3); pSnd(); uUI(); } }
    function sBtc() { if(btc>0){ cash+=Math.floor(btc*bPrice); btc=0; pSnd(); uUI(); } }
    setInterval(function(){
      let m=rAct?5:1, a=Math.floor(serv/5)*m; if(a>0){ hacked+=a; for(let i=0;i<a;i++)aCam(hacked%5===0&&kAct); }
      cash+=Math.floor((serv*2)+(sol*1.5))*m; if(rigs>0)btc+=(rigs*0.005*m); bPrice+=Math.floor((Math.random()*400)-200);
      if(bPrice<5000)bPrice=5000; uUI();
    },1000);
    iCams(); uUI();
  </script>
</body>
</html>
